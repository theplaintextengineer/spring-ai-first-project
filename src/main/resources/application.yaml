spring:
  application:
    name: spring-ai-first-project

  datasource:
    url: ${DB_URL}/pte_academy
    username: ${DB_USER}
    password: ${DB_PASSWORD}

    configuration:
      maximum-pool-size: 2

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:

server:
  address: 0.0.0.0
  port: 9090

vaadin:
  allowed-packages: com.vaadin,org.vaadin,com.flowingcode,com.example